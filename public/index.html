<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V!PER MD OFC – Connect Bot</title>
  <link rel="icon" href="https://i.ibb.co/G4z2SQ4M/160640.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #0b0b1a 0%, #02020f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      user-select: none;
      -webkit-user-select: none;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      animation: floatIn 0.8s ease;
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo {
      width: 85px;
      border-radius: 28px;
      margin-bottom: 16px;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
    }

    h1 {
      font-weight: 700;
      font-size: 2.1rem;
      background: linear-gradient(135deg, #c084fc, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .status-badge {
      display: inline-block;
      padding: 8px 22px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 24px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: 0.3s;
    }

    .status-badge.connected {
      background: rgba(34, 197, 94, 0.2);
      border-color: #22c55e;
      color: #22c55e;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
    }

    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .btn {
      border: none;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
      letter-spacing: 0.3px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(139, 92, 246, 0.4);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn.outline {
      background: transparent;
      border: 1.5px solid rgba(139, 92, 246, 0.6);
      box-shadow: none;
    }

    .section {
      display: none;
      animation: fadeSlide 0.4s ease;
    }

    .section.active {
      display: block;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #qrCanvas {
      width: 200px;
      height: 200px;
      margin: 0 auto 12px;
      border-radius: 24px;
      background: white;
      padding: 12px;
    }

    .qr-label {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    .input-group {
      margin: 18px 0;
    }

    .input-group input {
      width: 100%;
      padding: 14px 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.04);
      color: white;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
      text-align: center;
    }

    .input-group input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
    }

    .pairing-code {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #facc15, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 20px 0 8px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
      100% { opacity: 0.7; transform: scale(1); }
    }

    .pair-info {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.85rem;
      margin-bottom: 12px;
    }

    .success-card {
      display: none;
      animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .success-card.active {
      display: block;
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .checkmark {
      font-size: 5rem;
      color: #22c55e;
      text-shadow: 0 0 30px rgba(34, 197, 94, 0.6);
    }

    footer {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    footer p {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.35);
      line-height: 1.7;
    }

    .support-link {
      display: inline-block;
      background: #25D366;
      color: white;
      padding: 8px 20px;
      border-radius: 40px;
      text-decoration: none;
      font-size: 0.8rem;
      margin-top: 10px;
      font-weight: 600;
      transition: 0.3s;
    }

    .support-link:hover {
      background: #1da851;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
    }

    .loading-spinner {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 2.5px solid rgba(255, 255, 255, 0.2);
      border-top: 2.5px solid #8b5cf6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .glass-card { padding: 30px 20px; }
      h1 { font-size: 1.7rem; }
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <div class="container">
    <div class="glass-card">
      <img src="https://i.ibb.co/G4z2SQ4M/160640.png" alt="V!PER MD Logo" class="logo">
      <h1>V!PER MD OFC</h1>
      <p class="subtitle">Ultra‑fast WhatsApp Bot by Sasa Dev</p>

      <!-- Status badge -->
      <div class="status-badge" id="statusBadge">⏳ Checking...</div>

      <!-- Main actions -->
      <div class="btn-group" id="mainActions">
        <button class="btn" id="btnQR">📱 QR Connect</button>
        <button class="btn outline" id="btnNumber">🔢 Pair by Number</button>
      </div>

      <!-- QR Section -->
      <div class="section" id="qrSection">
        <canvas id="qrCanvas"></canvas>
        <div class="qr-label">Scan with WhatsApp</div>
        <button class="btn outline" id="btnRefreshQR">🔄 Refresh QR</button>
      </div>

      <!-- Number pairing Section -->
      <div class="section" id="numberSection">
        <div class="input-group">
          <input type="tel" id="phoneInput" placeholder="Phone with country code (e.g. 1234567890)" autocomplete="off">
        </div>
        <button class="btn" id="btnGetCode">
          <span id="btnText">Get Pairing Code</span>
        </button>
        <div id="pairingResult"></div>
      </div>

      <!-- Success message -->
      <div class="success-card" id="successCard">
        <div class="checkmark">✓</div>
        <h2 style="color:#22c55e; margin:10px 0">Connected Successfully!</h2>
        <p style="color:rgba(255,255,255,0.6)">Your bot is now online and ready.</p>
        <button class="btn" style="margin-top:18px" onclick="location.reload()">Manage Again</button>
      </div>

      <!-- Footer -->
      <footer>
        <p>© 𝙿𝙾𝚆𝙴𝚁𝙳 𝙱𝚈 𝚂𝙰𝚂𝙰 𝙳𝙴𝚅</p>
        <p>🙈 𝙲𝙾𝙽𝙽𝙴𝙲𝚃 𝚅!𝙿𝙴𝚁 𝙼𝙳 :- <a href="https://vipermd.sasatech.online" target="_blank" style="color:#c084fc;">vipermd.sasatech.online</a></p>
        <a href="https://whatsapp.com/channel/0029Vb86hKVJUM2SYD2qNw3K" target="_blank" class="support-link">💬 Support Channel</a>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script>
    (async function() {
      // DOM elements
      const statusBadge = document.getElementById('statusBadge');
      const qrSection = document.getElementById('qrSection');
      const numberSection = document.getElementById('numberSection');
      const successCard = document.getElementById('successCard');
      const mainActions = document.getElementById('mainActions');
      const pairingResult = document.getElementById('pairingResult');

      let pollingInterval = null;
      let connectionStatus = 'disconnected';

      // ----- Helper to update UI based on status -----
      function updateUI(status) {
        connectionStatus = status;
        statusBadge.textContent = status === 'open' ? '🟢 Connected' : status === 'connecting' ? '🟡 Connecting...' : '🔴 Disconnected';
        statusBadge.className = 'status-badge' + (status === 'open' ? ' connected' : '');

        if (status === 'open') {
          // Show success card, hide everything else
          successCard.classList.add('active');
          mainActions.style.display = 'none';
          qrSection.classList.remove('active');
          numberSection.classList.remove('active');
          clearInterval(pollingInterval); // stop polling once connected
        } else {
          successCard.classList.remove('active');
          mainActions.style.display = 'flex';
        }
      }

      // ----- Polling /api/status -----
      async function checkStatus() {
        try {
          const res = await fetch('/api/status');
          const data = await res.json();
          updateUI(data.status);
          return data;
        } catch (err) {
          statusBadge.textContent = '⚠️ Server Error';
          return { status: 'error' };
        }
      }

      // Start polling every 3 seconds
      pollingInterval = setInterval(checkStatus, 3000);
      await checkStatus(); // initial check

      // ----- QR Section -----
      document.getElementById('btnQR').addEventListener('click', async () => {
        qrSection.classList.add('active');
        numberSection.classList.remove('active');
        await loadQR();
      });

      document.getElementById('btnRefreshQR').addEventListener('click', loadQR);

      async function loadQR() {
        try {
          const res = await fetch('/api/qr');
          const data = await res.json();
          if (data.qr) {
            const canvas = document.getElementById('qrCanvas');
            QRCode.toCanvas(canvas, data.qr, { width: 220 });
          } else {
            alert('QR not available yet. Make sure bot is not already connected.');
          }
        } catch (err) {
          alert('Failed to load QR. Check server connection.');
        }
      }

      // ----- Number Pairing Section -----
      document.getElementById('btnNumber').addEventListener('click', () => {
        numberSection.classList.add('active');
        qrSection.classList.remove('active');
        pairingResult.innerHTML = '';
      });

      document.getElementById('btnGetCode').addEventListener('click', async () => {
        const phone = document.getElementById('phoneInput').value.trim();
        if (!phone) return alert('Please enter a phone number with country code.');

        const btn = document.getElementById('btnGetCode');
        const btnText = document.getElementById('btnText');
        btn.disabled = true;
        btnText.innerHTML = '<span class="loading-spinner"></span> Requesting...';

        try {
          const res = await fetch('/api/pair-number', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone })
          });

          const data = await res.json();

          if (data.code) {
            pairingResult.innerHTML = `
              <div class="pairing-code">${data.code}</div>
              <div class="pair-info">Enter this code in your WhatsApp (Linked Devices → Link with phone number)</div>
            `;
          } else if (data.success) {
            pairingResult.innerHTML = '<div style="color:#22c55e; margin-top:15px;">✅ Connected! No code needed.</div>';
            updateUI('open');
          } else {
            pairingResult.innerHTML = `<div style="color:#f87171; margin-top:15px;">❌ ${data.error || 'Failed. Try again.'}</div>`;
          }
        } catch (err) {
          pairingResult.innerHTML = '<div style="color:#f87171; margin-top:15px;">❌ Request failed. Is the server running?</div>';
        } finally {
          btn.disabled = false;
          btnText.textContent = 'Get Pairing Code';
        }
      });

      // If user navigates away, stop polling (optional)
      window.addEventListener('beforeunload', () => clearInterval(pollingInterval));
    })();
  </script>
</body>
</html>
